{% extends "base.html" %}

{% block content %}
    <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
        <h1 class="page-title">会话管理</h1>
        <div class="flex gap-2 flex-wrap">
            <a href="/dialogue/single" class="btn-primary">新建单英雄对话</a>
            <a href="/dialogue/multi" class="btn-secondary">新建多英雄对话</a>
        </div>
    </div>

    {% if sessions %}
        <ul class="list-reset stack">
            {% for session in sessions %}
                <li class="card p-4">
                    <a href="/sessions/{{ session.session_id }}" class="text-blue-700 font-semibold hover:underline">
                        会话 ID: {{ session.session_id }}
                    </a>
                    <p class="muted mt-1">类型：{{ session.session_type }}｜轮次：{{ session.round_count }}</p>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <div class="card p-5 muted">当前还没有会话记录，请先创建一场对话。</div>
    {% endif %}
{% endblock %}
