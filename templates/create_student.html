{% extends "base.html" %}

{% block content %}
    <section class="card p-6 md:p-8">
        <h1 class="page-title mb-2">创建学生智能体</h1>
        <p class="muted mb-6">必填字段很少，其他都可按需填写。多条信息建议一行一条。</p>

        <form action="/students/create" method="POST" class="space-y-4">
            <label class="block">
                <span>姓名</span>
                <input type="text" name="name" required placeholder="请输入学生姓名">
            </label>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <label class="block">
                    <span>年级</span>
                    <input type="text" name="grade" required placeholder="例如：大二">
                </label>

                <label class="block">
                    <span>专业</span>
                    <input type="text" name="major" required placeholder="例如：计算机科学与技术">
                </label>
            </div>

            <label class="block">
                <span>当前身份</span>
                <input type="text" name="identity" placeholder="例如：正在准备考研的工科学生">
            </label>

            <label class="block">
                <span>自我认知</span>
                <textarea name="self_view" rows="2" placeholder="比如：执行力强，但常常方向不清"></textarea>
            </label>

            <label class="block">
                <span>当前学习困惑（每行一条）</span>
                <textarea name="current_confusions" rows="3" placeholder="例如：
不知道如何把专业能力转化为实际价值
时间管理困难"></textarea>
            </label>

            <label class="block">
                <span>希望得到的启发</span>
                <textarea name="opening_expectation" rows="2" placeholder="比如：希望学习长期主义与责任感"></textarea>
            </label>

            <button type="submit" class="btn-primary">提交</button>
        </form>
    </section>
{% endblock %}
