{% extends "base.html" %}

{% block content %}
    <div class="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <h1 class="page-title">学生管理</h1>
        <a href="/students/create" class="btn-primary">新建学生</a>
    </div>

    {% if students %}
        <ul class="list-reset stack">
            {% for student in students %}
                <li class="card p-4">
                    <p><strong>学生文档 ID：</strong>{{ student.doc_id }}</p>
                    <p class="muted text-sm break-all mt-1"><strong>文件：</strong>{{ student.file }}</p>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <div class="card p-5 muted">暂时还没有学生档案，点击右上角“新建学生”开始创建。</div>
    {% endif %}
{% endblock %}
