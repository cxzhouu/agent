{% extends "base.html" %}

{% block content %}
    <h1 class="page-title mb-4">英雄列表</h1>

    <ul class="list-reset stack">
        {% for hero in heroes %}
            <li class="card p-4 flex items-center gap-4">
                <div class="hero-list-avatar" data-fallback="{{ hero.name[0] }}">
                    <img src="{{ url_for('static', filename=hero.avatar) }}" alt="{{ hero.name }}头像" class="hero-list-avatar-img" onerror="this.remove(); this.parentElement.classList.add('avatar-fallback'); this.parentElement.textContent=this.parentElement.dataset.fallback;">
                </div>
                <div>
                    <p><strong>人物：</strong>{{ hero.name }}</p>
                    <p class="muted text-sm mt-1"><strong>文档 ID：</strong>{{ hero.doc_id }}</p>
                </div>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
